<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#051225" />
  <title>Bolão Seleção Brasileira 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" onclick="go('home')"><div class="logo-mark">🐆</div><span>JBPIX</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Tema">☀️</button>
        <button class="icon-btn" onclick="go('tutorial')" title="Tutorial">🔔</button>
        <button class="avatar" id="avatarBtn" onclick="toggleDrawer()">K</button>
        <button class="hamb" onclick="toggleDrawer()">☰</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav">
      <button data-page="home" onclick="go('home')">🏠<span>Início</span></button>
      <button data-page="games" onclick="go('games')">⚽<span>Jogos</span></button>
      <button data-page="ranking" onclick="go('ranking')">📊<span>Ranking</span></button>
      <button data-page="stats" onclick="go('stats')">📈<span>Stats</span></button>
      <button data-page="admin" onclick="go('admin')">🔐<span>Admin</span></button>
    </nav>

    <aside id="drawer" class="drawer">
      <div class="drawer-handle"></div>
      <div class="profile-row"><div class="avatar big" id="drawerAvatar">K</div><div><b id="drawerName">Visitante</b><p>🏆 <span id="drawerPts">0</span> pontos</p></div></div>
      <button onclick="go('home');toggleDrawer(false)">🏠 Início</button>
      <button onclick="go('games');toggleDrawer(false)">⚽ Jogos</button>
      <button onclick="go('ranking');toggleDrawer(false)">📊 Ranking</button>
      <button onclick="go('stats');toggleDrawer(false)">📈 Stats</button>
      <button onclick="go('tutorial');toggleDrawer(false)">📖 Tutorial</button>
      <button onclick="go('admin');toggleDrawer(false)">🔐 Painel Admin</button>
      <button class="danger ghost" onclick="logout()">🚪 Sair da conta</button>
    </aside>
    <div id="shade" class="shade" onclick="toggleDrawer(false)"></div>
  </div>
<script src="app.js"></script>
</body>
</html>
